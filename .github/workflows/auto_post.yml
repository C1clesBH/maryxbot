name: Publicador Automático de Mary (X)

on:
  schedule:
    # Horarios en UTC (Argentina es UTC-3)
    - cron: '30 10 * * *'  # 07:30 AM Argentina (Fitness / Gym)
    - cron: '00 17 * * *'  # 14:00 PM Argentina (Streetwear / Café)
    - cron: '30 21 * * *'  # 18:30 PM Argentina (Pregunta / Engagement)
    - cron: '30 01 * * *'  # 22:30 PM Argentina (After Dark / VIP)
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoría a publicar'
        required: false
        default: 'now'
        type: choice
        options:
          - now
          - morning
          - afternoon
          - night
          - poll

jobs:
  post_tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Publicar Tweet en X
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          MARY_TELEGRAM_VIP: ${{ secrets.MARY_TELEGRAM_VIP }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot_cloud.py --post ${{ inputs.category }}
          else
            python bot_cloud.py --post now
          fi
