name: Respuestas Automáticas de Mary (DMs y Menciones)

on:
  schedule:
    # Se ejecuta cada 5 minutos de forma ilimitada
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  reply_messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Revisar y responder mensajes
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          MARY_TELEGRAM_VIP: ${{ secrets.MARY_TELEGRAM_VIP }}
          X_CHAT_PIN: "0416"
        run: python bot_cloud.py --reply

      - name: Guardar historial de respuestas
        run: |
          git config --global user.name "mary-bot[bot]"
          git config --global user.email "mary-bot@users.noreply.github.com"
          git add replied_history.json || true
          git commit -m "chore: actualizar historial de respuestas [skip ci]" || true
          git push || true
