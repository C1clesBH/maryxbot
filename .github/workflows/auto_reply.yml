name: Respuestas Automáticas de Mary (DMs y Menciones)

on:
  schedule:
    # Se despierta cada 20 minutos
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: mary-reply-guard
  cancel-in-progress: false

jobs:
  reply_messages:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Vigilancia continua de mensajes (escaneo cada 2 minutos)
        env:
          PYTHONUNBUFFERED: "1"
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          MARY_TELEGRAM_VIP: ${{ secrets.MARY_TELEGRAM_VIP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          X_CHAT_PIN: "0416"
        run: python -u bot_cloud.py --reply --loop 18

      - name: Guardar historial de respuestas
        if: always()
        run: |
          git config --global user.name "mary-bot[bot]"
          git config --global user.email "mary-bot@users.noreply.github.com"
          git add replied_history.json || true
          git commit -m "chore: actualizar historial de respuestas [skip ci]" || true
          git push || true
