name: Respuestas Automáticas de Mary (DMs y Menciones)

on:
  schedule:
    # Se ejecuta solo cada 2 horas automáticamente
     - cron: '*/5 * * * *'  # Se ejecuta cada 5 minutos
  workflow_dispatch:

jobs:
  reply_messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Revisar y responder mensajes
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          MARY_TELEGRAM_VIP: ${{ secrets.MARY_TELEGRAM_VIP }}
        run: python bot_cloud.py --reply
